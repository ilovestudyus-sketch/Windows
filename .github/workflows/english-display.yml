name: English display test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-display
  cancel-in-progress: false

jobs:
  english:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the English display test
        shell: pwsh
        run: node --test english/locale-switch.test.mjs
